[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopscope"
version = "0.1.0b1"
description = "Local live dashboard for LangGraph graphs and Ralph loops"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Nicolas Cravino", email = "spidernic@me.com"},
]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "websockets==16.1.1",
]

[project.urls]
Homepage = "https://github.com/sw30labs/loopscope"
Repository = "https://github.com/sw30labs/loopscope"
Issues = "https://github.com/sw30labs/loopscope/issues"

[project.optional-dependencies]
langgraph = ["langgraph==1.2.11", "langchain-core==1.6.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
loopscope-replay = "loopscope.replay:main"

[tool.setuptools.packages.find]
include = ["loopscope*"]

[tool.setuptools.package-data]
loopscope = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
